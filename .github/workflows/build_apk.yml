name: Build & Release Rajyo Darpan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Build Standalone Clean App & Assemble Release APK
        run: |
          cd $RUNNER_TEMP
          flutter create --org in.rajyodarpan --project-name rajyo_darpan_publisher my_app
          
          # Replace lib directory completely
          rm -rf my_app/lib
          cp -r $GITHUB_WORKSPACE/lib my_app/lib
          
          cd my_app
          
          # Add dependencies
          flutter pub add provider:^6.1.2 http:^1.2.2 intl:^0.19.0 flutter_secure_storage:^9.2.2 sqflite:^2.3.3+1 path:^1.9.0 shared_preferences:^2.3.2 image_picker:^1.1.2 google_fonts:^6.2.1
          
          # Set minSdk to 21
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          
          # Build APK
          flutter build apk --release
          
          # Copy APK to workspace
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rajyo-darpan-publisher-release-apk
          path: output/app-release.apk

name: Build & Release Rajyo Darpan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Build Release APK
        run: |
          cd $RUNNER_TEMP
          flutter create --org in.rajyodarpan --project-name rajyo_darpan_publisher rajyo_darpan_publisher
          
          # Replace lib, assets and pubspec.yaml with our repository versions
          rm -rf rajyo_darpan_publisher/lib rajyo_darpan_publisher/assets
          cp -r $GITHUB_WORKSPACE/lib rajyo_darpan_publisher/lib
          cp -r $GITHUB_WORKSPACE/assets rajyo_darpan_publisher/assets
          cp $GITHUB_WORKSPACE/pubspec.yaml rajyo_darpan_publisher/pubspec.yaml
          
          cd rajyo_darpan_publisher
          
          # Install dependencies exactly from clean pubspec.yaml
          flutter pub get
          
          # Generate Official Launcher Icons from assets/images/app_logo.webp
          dart run flutter_launcher_icons
          
          # Ensure INTERNET and network permissions in AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # Set compileSdk 35 and minSdk 21 in build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          
          # Build APK
          flutter build apk --release
          
          # Copy APK to workspace
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rajyo-darpan-publisher-release-apk
          path: output/app-release.apk

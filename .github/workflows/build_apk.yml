name: Build & Release Rajyo Darpan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Release APK
        run: |
          # Use flutter create . to generate the android folder in-place
          flutter create --org in.rajyodarpan --project-name rajyo_darpan_publisher .
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rajyo-darpan-publisher-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

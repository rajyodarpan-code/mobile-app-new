name: Build & Release Rajyo Darpan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Build Standalone Clean App & Assemble Release APK
        run: |
          cd $RUNNER_TEMP
          flutter create --org in.rajyodarpan --project-name rajyo_darpan_publisher rajyo_darpan_publisher
          
          # Replace lib and assets directories completely
          rm -rf rajyo_darpan_publisher/lib
          cp -r $GITHUB_WORKSPACE/lib rajyo_darpan_publisher/lib
          cp -r $GITHUB_WORKSPACE/assets rajyo_darpan_publisher/assets
          
          cd rajyo_darpan_publisher
          
          # Add dependencies
          flutter pub add provider:^6.1.2 http:^1.2.2 intl:^0.19.0 flutter_secure_storage:^9.2.2 sqflite:^2.3.3+1 path:^1.9.0 shared_preferences:^2.3.2 image_picker:^1.1.2 google_fonts:^6.2.1 flutter_launcher_icons:^0.13.1 --dev
          
          # Enable assets and flutter_launcher_icons in pubspec.yaml
          cat << 'EOF' >> pubspec.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_logo.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.webp"

flutter:
  assets:
    - assets/images/
EOF

          # Generate App Icons using flutter_launcher_icons
          dart run flutter_launcher_icons

          # Ensure AndroidManifest uses the new launcher icon
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/launcher_icon"/g' android/app/src/main/AndroidManifest.xml || true
          
          # Ensure INTERNET and network permissions in AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # Set compileSdk 35 and minSdk 21 in build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          
          # Build APK
          flutter build apk --release
          
          # Copy APK to workspace
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rajyo-darpan-publisher-release-apk
          path: output/app-release.apk

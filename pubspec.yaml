name: rajyo_darpan_publisher
description: "Rajyo Darpan Publisher - Manual WordPress news publishing mobile app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  http: ^1.2.2
  dio: ^5.7.0
  intl: ^0.19.0

  # Storage & Offline Drafts
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Media & Picker
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  cached_network_image: ^3.4.1

  # HTML & Rich Text
  flutter_html: ^3.0.0-beta.2
  html_editor_enhanced: ^2.6.0
  url_launcher: ^6.3.0

  # UI & Animations
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

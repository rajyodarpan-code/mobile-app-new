name: rajyo_darpan_publisher
description: "Rajyo Darpan Publisher - Manual WordPress news publishing mobile app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  http: ^1.2.2
  intl: ^0.19.0

  # Storage & Offline Drafts
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Media & Picker
  image_picker: ^1.1.2

  # Fonts & Icons
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
